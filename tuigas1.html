<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h3>~TAMBAH DATA SISWA~</h3>
      <table>
        <tr>
          <td>NIS</td>
        </tr>

        <tr>
          <td class="name-inputs">
            <input type="text" placeholder="Masukan Nis" />
          </td>
        </tr>

        <tr>
          <td>Nama Lengkap</td>
        </tr>

        <tr>
          <td class="name-inputs">
            <input type="text" placeholder="Masukan Nama Lengkap" />
          </td>
        </tr>

        <tr>
          <td>Kelas</td>
        </tr>
        <tr>
          <td class="name-inputs">
            <select name="kelas" id="kelas">
            <option value="" disabled selected hidden>Pilih kelas</option>
            <option value="XI RPL 1">Kelas XI RPL 1</option>
            <option value="XI RPL 2">Kelas XI RPL 2</option>
            <option value="XI RPL 3">Kelas XI RPL 3</option>
            <option value="XI RPL 4">Kelas XI RPL 4</option>
            </select>
          </td>
        </tr>       
      
        <tr>
            <td>Jenis Kelamin</td>
        </tr>
        </table>
        <divclass="gender"> <input type="radio" name="gender"> Laki Laki <input type="radio" name="gender" 
        style="margin-left: 10px;"> Perempuan</div>

        <table>
        <tr>
           <td>Tanggal Lahir</td>
        </tr>
        <tr>
            <td class="text-inputs">
            <input type="date" id="tanggal_lahir" name="tanggal_lahir">
        </tr>
        <tr>
            <td>
                <button type="submit">&#43; Simpan</button>
                <button type="resset">&#8635; Resset</button>      
             </td>
        </tr>
      </table>
    </div>
    <div class="container">
      <h3>Data Siswa</h3>
      <table>
        <tr>
            <td style="padding: 20px;">No</td>

        </tr>
        <tr>
          <td style="padding: 20px;">Nis</td>

        </tr>
      </table>
    </div>
  </body>
</html>
